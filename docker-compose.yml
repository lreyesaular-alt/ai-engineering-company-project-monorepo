services:
  redis:
    image: redis:7-alpine
    container_name: async-tasks-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - async_redis_data:/data

  flower:
    image: mher/flower:2.0
    container_name: async-tasks-flower
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  async_redis_data: